name: skilld-web

services:
  web:
    image: skilld-web:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Set the public site URL in .env.docker}
    environment:
      SKILLD_API_URL: ${SKILLD_API_URL:?Set the HTTPS backend API URL in .env.docker}
      SKILLD_WEB_ORIGIN: ${SITE_URL:?Set the public site URL in .env.docker}
      SKILLD_TRUST_PROXY: "true"
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.docker}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/cloudflare-real-ip.conf:/etc/nginx/snippets/cloudflare-real-ip.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
